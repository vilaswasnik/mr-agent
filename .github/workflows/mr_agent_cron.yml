name: Mr. Agent Scheduled Modes

on:
  schedule:
    - cron: '0 9 * * 1-5' # Mid mode on weekdays at 09:00 UTC
    - cron: '0 9 * * 0' # Advanced mode on Sunday at 09:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-mid:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Mr. Agent Mid Mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py --mid --max-prs 5 --max-comments 20

  run-advanced:
    if: github.event.schedule == '0 9 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Mr. Agent Advanced Mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py --advanced --max-prs 5 --max-comments 20
